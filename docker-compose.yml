# `docker compose up` runs the whole tamper demo with zero manual steps:
#   postgres  → initialised with least-privilege roles (deploy/postgres/init)
#   keygen    → server image, `--ensure-key`: creates the ECDSA P-256 tree-head key once. The private key stays in
#               the `signing-key` volume (server only); the public key goes to `trusted-keys` (verifiers only)
#   migrator  → server image, `--migrate-only`, connects as the schema owner, exits
#   server    → the log, connects as audit_app, signs a tree head every second
#   demo      → seeds 200 synthetic entries (a signed head every 25), then plays a rogue DBA: alters, deletes,
#               reorders, inserts and finally rewrites a row *and* the tree, as the PostgreSQL superuser with the
#               append-only triggers bypassed. After each attack the independent verifier audits the log over HTTP
#               and must pinpoint the change; the attack is undone and the log must audit clean again.
#               Exits 0 only if every attack was detected.
# Afterwards, audit the log yourself with the standalone CLI:
#   docker compose run --rm verify
# Optional: `docker compose --profile observability up` adds the Aspire dashboard as an OTLP backend
# (set OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889, see .env.example).
name: merkle-audit

x-server-image: &server-image
  image: merkle-audit-server:local
  build:
    context: .
    dockerfile: Dockerfile

x-demo-image: &demo-image
  image: merkle-audit-demo:local
  build:
    context: .
    dockerfile: samples/MerkleAudit.Demo/Dockerfile

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: merkleaudit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-dev-only}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:-migrator-dev-only}
      APP_PASSWORD: ${APP_PASSWORD:-app-dev-only}
      READER_PASSWORD: ${READER_PASSWORD:-reader-dev-only}
    ports:
      # Loopback only: lets `dotnet run` (appsettings.Development.json) and psql use this database.
      - "127.0.0.1:${POSTGRES_PORT:-58732}:5432"
    volumes:
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d merkleaudit"]
      interval: 2s
      timeout: 3s
      retries: 30

  keygen:
    <<: *server-image
    command: ["--ensure-key", "/keys", "/trusted"]
    volumes:
      - signing-key:/keys
      - trusted-keys:/trusted
    restart: "no"

  migrator:
    <<: *server-image
    command: ["--migrate-only"]
    environment:
      ConnectionStrings__Default: Host=postgres;Database=merkleaudit;Username=audit_migrator;Password=${MIGRATOR_PASSWORD:-migrator-dev-only}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    <<: *server-image
    ports:
      - "127.0.0.1:${SERVER_PORT:-58780}:8080"
    environment:
      ConnectionStrings__Default: Host=postgres;Database=merkleaudit;Username=audit_app;Password=${APP_PASSWORD:-app-dev-only};Timeout=5
      Signing__KeyFile: /keys/sth-signing.pem
      Log__PublishInterval: "00:00:01"
      Log__AppendApiKeys__0: ${APPEND_API_KEY:-append-dev-only}
      OpenApi__Enabled: "true"
      OTEL_SERVICE_NAME: merkle-audit
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - signing-key:/keys:ro
    depends_on:
      migrator:
        condition: service_completed_successfully
      keygen:
        condition: service_completed_successfully
    # No container HEALTHCHECK: the chiseled image has no shell or curl. Probe /health/live and /health/ready over HTTP.
    restart: unless-stopped

  demo:
    <<: *demo-image
    environment:
      LOG_URL: http://server:8080/
      APPEND_API_KEY: ${APPEND_API_KEY:-append-dev-only}
      # The rogue administrator: the PostgreSQL superuser, the one account no database control can stop.
      PG_SUPERUSER: Host=postgres;Database=merkleaudit;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres-dev-only}
      TRUSTED_KEYS_DIR: /trusted
    volumes:
      - trusted-keys:/trusted:ro
    depends_on:
      server:
        condition: service_started
    restart: "no"

  verify:
    <<: *demo-image
    profiles: ["tools"]
    entrypoint: ["dotnet", "/app/verify/merkle-verify.dll"]
    command: ["audit", "--log", "http://server:8080/", "--key-dir", "/trusted"]
    volumes:
      - trusted-keys:/trusted:ro

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6
    profiles: ["observability"]
    environment:
      # Local-only convenience; never expose an unsecured dashboard beyond localhost.
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
      DASHBOARD__OTLP__AUTHMODE: Unsecured
    ports:
      - "127.0.0.1:58788:18888"

volumes:
  pgdata:
  signing-key:
  trusted-keys:
